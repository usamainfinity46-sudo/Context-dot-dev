services:
  app:
    build: .
    init: true
    ports:
      - "127.0.0.1:3100:3100"
    environment:
      HOST: 0.0.0.0
      PORT: 3100
      DATA_DIR: /app/data
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      ALLOW_LOCAL_TARGETS: ${ALLOW_LOCAL_TARGETS:-false}
    volumes:
      - context-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: 1gb
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
volumes:
  context-data:
